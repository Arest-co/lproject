<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LProyects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D0F14; --surface:#151822; --line:#262B38;
    --text:#F1F3F7; --muted:#7C8494; --accent:#B4FF39; --accent-dim:#8FCC24;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:
      radial-gradient(circle at 1px 1px, #1D212C 1px, transparent 0) 0 0/24px 24px,
      var(--bg);
    color:var(--text); font-family:'Space Grotesk',sans-serif;
  }
  a{color:inherit;}
  .wrap{max-width:760px; margin:0 auto; padding:0 20px;}
  header{padding:28px 0 0;}
  .logo{font-weight:700; font-size:20px; letter-spacing:-.02em; display:flex; align-items:center; gap:8px;}
  .logo .dot{width:9px; height:9px; border-radius:50%; background:var(--accent); box-shadow:0 0 12px var(--accent);}
  .logo span{color:var(--accent);}
  .hero{padding:26px 0 40px; border-bottom:1px solid var(--line);}
  .hero h1{font-size:clamp(30px,6vw,44px); line-height:1.05; margin:0 0 12px; letter-spacing:-.03em; max-width:11ch;}
  .hero p{color:var(--muted); font-size:15px; max-width:46ch; line-height:1.5; margin:0;}
  main{padding:36px 0 90px;}
  .section-title{font-size:12px; color:var(--muted); font-family:'Space Mono',monospace; letter-spacing:.06em; margin:0 0 18px; display:flex; align-items:center; gap:10px;}
  .section-title::after{content:""; flex:1; height:1px; background:var(--line);}
  .grid{display:grid; gap:14px;}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:20px; position:relative; overflow:hidden;
  }
  .card::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent);}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;}
  .card-top h3{margin:0; font-size:19px; letter-spacing:-.01em;}
  .ver{
    color:var(--accent); font-size:12px; font-family:'Space Mono',monospace;
    background:rgba(180,255,57,.1); border:1px solid rgba(180,255,57,.25);
    padding:3px 9px; border-radius:20px; white-space:nowrap;
  }
  .desc{color:#B8BFCC; font-size:14px; line-height:1.55; margin:10px 0 18px; max-width:52ch;}
  .btn{
    display:inline-flex; align-items:center; gap:7px; background:var(--accent); color:#0B0D12;
    text-decoration:none; font-weight:600; font-size:14px; padding:10px 18px; border-radius:6px;
    transition:background .15s ease;
  }
  .btn:hover{background:var(--accent-dim);}
  .btn svg{width:14px; height:14px;}
  .empty{color:var(--muted); text-align:center; padding:70px 0; font-size:14px;}
  footer{border-top:1px solid var(--line); padding:20px 0 40px;}
  footer p{color:var(--muted); font-size:12px; font-family:'Space Mono',monospace; margin:0;}
</style>
</head>
<body>
<header class="wrap">
  <div class="logo"><span class="dot"></span>LPro<span>ject</span>s</div>
  <div class="hero">
    <h1>Betas antes que nadie</h1>
    <p>Acá subo las versiones de prueba de mis apps. Descargalas, probalas y si algo se rompe, ya sabés que es normal — para eso son las betas.</p>
  </div>
</header>
<main class="wrap">
  <p class="section-title">DISPONIBLES</p>
  <div class="grid" id="list"><p class="empty">Cargando…</p></div>
</main>
<footer class="wrap"><p>LProyects — actualizado a mano, con cariño.</p></footer>

<script>
fetch("projects.json")
  .then(res => res.json())
  .then(projects => {
    const list = document.getElementById("list");
    if (!projects || projects.length === 0) {
      list.innerHTML = `<p class="empty">Todavía no hay betas publicadas.</p>`;
      return;
    }
    list.innerHTML = projects.map(p => `
      <div class="card">
        <div class="card-top"><h3>${p.name}</h3><span class="ver">v${p.version}</span></div>
        <p class="desc">${p.description}</p>
        <a class="btn" href="${p.downloadUrl}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
          Descargar
        </a>
      </div>
    `).join("");
  })
  .catch(() => {
    document.getElementById("list").innerHTML =
      `<p class="empty">No se pudo cargar projects.json. Revisá que esté en la misma carpeta que index.html.</p>`;
  });
</script>
</body>
</html>
